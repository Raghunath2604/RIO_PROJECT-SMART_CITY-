name: Fog-IDS Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Lint, Sanity Check & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies (OpenMP for LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Model Manifest & Checksums
        run: |
          python models/model_loader.py

      - name: Execute Code Sanity Checking
        run: |
          python verify_all_live.py

      - name: Run Automated Test Suites
        run: |
          pytest tests/ --maxfail=1 --disable-warnings -v
